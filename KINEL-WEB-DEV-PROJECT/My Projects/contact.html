<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Me</title>

        <!-- Link to CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <h1>This is our contact page</h1>
    <a href="index.html" target="_blank">Back to Home</a>






    

    <form>

        

        <label for="name">Full Name</label><br>
        <input type="text" id="name" placeholder="e.g Alexander Smith"><br><br>

        <label for="email">Email Address</label><br>
        <input type="email" id="email" placeholder="e.g alex@email.com"><br><br>
      
        <label for="number">Phone Number</label><br>
        <input type="tel" id="number" placeholder="e.g +234 812 345 6789"><br><br>
  

          <label>Subject</label>

         <select name="Subject">
            <option value="">_Please Select_</option>
            <option value="freelance">Freelance Project</option>
            <option value="job">Job Opportunity</option>
            <option value="general">General Inquiry</option>



         </select>

            <br><br><br>


        <!-- Message -->
        <label>Message:</label>
        <textarea placeholder="Tell us about your project..."></textarea>



        <!-- Send Message -->
         <button>Send Message</button>




    </form>

    <br><br>

    <h3>Other ways to reach me:</h3>
    <p>Email: jolayofatai6@gmail.com</p>
    <p>Phone: +234 812 456 6478</p>

</body>
</html>
